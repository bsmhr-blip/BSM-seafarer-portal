<script>
  // Send any wrong link back to the prototype home (works for project and user Pages sites).
  (function () {
    var seg = location.pathname.split('/')[1];
    var isProject = location.hostname.indexOf('github.io') > -1 && seg && seg.indexOf('.') === -1;
    location.replace(isProject ? '/' + seg + '/' : '/');
  })();
</script>
